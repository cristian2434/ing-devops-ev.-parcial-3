name: CI/CD + Security Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:

  # ---------------------------------------------------------------
  # 0) Auditoria de politicas de cumplimiento sobre los manifiestos de
  #    Kubernetes (IE5). Si incumplen una politica (sin limits, sin probes,
  #    root, imagen :latest...) el pipeline se detiene aqui (IE6).
  # ---------------------------------------------------------------
  policy-audit:
    name: Auditoria de politicas K8s
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Instalar PyYAML
        run: "python3 -m pip install --quiet --only-binary :all: pyyaml==6.0.2"

      - name: Auditar manifiestos de Kubernetes
        run: python3 scripts/audit-k8s.py k8s

  # ---------------------------------------------------------------
  # 1) Escaneo de seguridad con Snyk. Falla (y bloquea el pipeline)
  #    si encuentra vulnerabilidades altas o criticas (IE3).
  # ---------------------------------------------------------------
  snyk-scan:
    name: Snyk Security Scan
    needs: policy-audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Configurar JDK 17
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Instalar Snyk CLI
        uses: snyk/actions/setup@9adf32b1121593767fc3c057af55b55db032dc04 # v1.0.0

      # Snyk usa ./mvnw si existe. En Git (desde Windows) queda sin permiso
      # de ejecucion y Snyk falla con "exit code: -13" (EACCES).
      - name: Dar permiso de ejecucion al wrapper de Maven
        run: chmod +x mvnw

      - name: Escaneo de dependencias (bloquea y genera reporte JSON)
        run: snyk test --file=pom.xml --severity-threshold=high --json-file-output=snyk-report.json
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}

      # Requiere activar "Snyk Code" en Settings de tu cuenta de Snyk.
      # Si no lo activas, comenta este paso.
      - name: Analisis de codigo
        run: snyk code test --severity-threshold=high
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}

      - name: Subir reporte de Snyk
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: snyk-report
          path: snyk-report.json
          if-no-files-found: ignore

  # ---------------------------------------------------------------
  # 2) Pruebas unitarias + cobertura (JaCoCo). Falla si la cobertura
  #    baja del minimo definido en el pom.xml (IE2).
  # ---------------------------------------------------------------
  test:
    name: Run Tests with JaCoCo
    needs: snyk-scan
    runs-on: ubuntu-latest
    outputs:
      coverage: ${{ steps.cov.outputs.coverage }}
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Configurar JDK 17
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Ejecutar pruebas y verificar cobertura
        run: mvn -B clean verify

      # Cobertura total de instrucciones leida de jacoco.csv. El deploy la
      # publica como metrica en CloudWatch (dashboard, IE3).
      - name: Calcular cobertura total (JaCoCo)
        id: cov
        run: |
          COV=$(awk -F, 'NR>1 {m+=$4; c+=$5} END {if (m+c>0) printf "%.2f", 100*c/(m+c); else print "0"}' target/site/jacoco/jacoco.csv)
          echo "coverage=${COV}" >> "$GITHUB_OUTPUT"
          echo "Cobertura de instrucciones: ${COV}%"
          echo "### Cobertura JaCoCo: ${COV}%" >> "$GITHUB_STEP_SUMMARY"

      - name: Publicar reporte de JaCoCo
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: jacoco-report
          path: target/site/jacoco/

  # ---------------------------------------------------------------
  # 3) Analisis de calidad con SonarCloud. Espera el Quality Gate (IE3).
  # ---------------------------------------------------------------
  sonar:
    name: SonarCloud Analysis
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0

      - name: Configurar JDK 17
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Analisis con SonarCloud
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          mvn -B clean verify \
            org.sonarsource.scanner.maven:sonar-maven-plugin:5.8.0.7211:sonar \
            -Dsonar.projectKey=cristian2434_ing-devops-ev.-parcial-3 \
            -Dsonar.organization=cristian2434 \
            -Dsonar.host.url=https://sonarcloud.io \
            -Dsonar.coverage.jacoco.xmlReportPaths=target/site/jacoco/jacoco.xml \
            -Dsonar.qualitygate.wait=true \
            -Dsonar.qualitygate.timeout=300

  # ---------------------------------------------------------------
  # 4) Empaquetado del JAR (igual que en la actividad).
  # ---------------------------------------------------------------
  build:
    name: Build JAR
    needs: sonar
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Configurar JDK 17
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Empaquetar JAR
        run: mvn -B clean package -DskipTests

      - name: Subir JAR
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: app-jar
          path: target/*.jar

  # ---------------------------------------------------------------
  # 5) Imagen Docker. Solo se publica en GHCR en push a main; queda
  #    etiquetada con el SHA del commit (trazabilidad, IE1 / IE4).
  # ---------------------------------------------------------------
  docker:
    name: Build Docker Image
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.meta.outputs.image }}
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      # Nombre fijo y valido para Docker. El repo se llama "ing-devops-ev.-parcial-3"
      # (un "." pegado a un "-" no es valido en una referencia de imagen), por eso
      # NO se usa github.repository para armar la etiqueta.
      - name: Calcular nombre de la imagen
        id: meta
        env:
          IMAGE_NAME: ghcr.io/cristian2434/ing-devops-ev-parcial-3
        run: |
          echo "image=${IMAGE_NAME}:${GITHUB_SHA}" >> "$GITHUB_OUTPUT"
          echo "latest=${IMAGE_NAME}:latest" >> "$GITHUB_OUTPUT"

      - name: Configurar Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - name: Login en GHCR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # 1. Se construye la imagen SIN publicarla (queda solo en el runner).
      - name: Construir imagen (sin publicar)
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          load: true
          push: false
          tags: ${{ steps.meta.outputs.image }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # 2. Trivy escanea la imagen. Una vulnerabilidad CRITICAL con correccion
      #    disponible detiene el pipeline: la imagen no llega a GHCR (IE5/IE6).
      #    Accion fijada por SHA (v0.35.0) y Trivy v0.69.3: las versiones
      #    posteriores a v0.69.3 / etiquetas anteriores a 0.35.0 estuvieron
      #    comprometidas en marzo de 2026 (GHSA-69fq-xp46-6x23).
      - name: Escanear imagen con Trivy (bloquea si hay CRITICAL)
        uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1 # v0.35.0
        with:
          image-ref: ${{ steps.meta.outputs.image }}
          version: v0.69.3
          scanners: vuln
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: '1'
          format: table

      # 3. Solo si el escaneo paso y estamos en main, se publica en GHCR.
      - name: Publicar imagen en GHCR (solo main)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          push: true
          tags: |
            ${{ steps.meta.outputs.image }}
            ${{ steps.meta.outputs.latest }}
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          cache-from: type=gha

  # ---------------------------------------------------------------
  # 6) Despliegue automatico en Kubernetes (k3s sobre EC2) por SSH.
  #    Solo en push a main (IE4 / IE5). Despliega la imagen exacta
  #    construida en este mismo run (etiqueta = SHA del commit).
  # ---------------------------------------------------------------
  deploy:
    name: Deploy (Kubernetes k3s)
    needs: [docker, test]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: produccion-simulada
    permissions:
      contents: read
      packages: read
    env:
      APP_IMAGE: ${{ needs.docker.outputs.image }}
      COVERAGE: ${{ needs.test.outputs.coverage }}
      EC2_HOST: ${{ secrets.EC2_HOST }}
      EC2_USER: ${{ secrets.EC2_USER || 'ec2-user' }}
      DB_TNS_ALIAS: ${{ secrets.DB_TNS_ALIAS }}
      DB_USERNAME: ${{ secrets.DB_USERNAME }}
      DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
    steps:
      - name: Marcar inicio del despliegue
        run: echo "DEPLOY_START=$(date +%s)" >> "$GITHUB_ENV"

      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Configurar acceso SSH a la EC2
        env:
          EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$EC2_SSH_KEY" | tr -d '\r' > ~/.ssh/ec2.pem
          chmod 600 ~/.ssh/ec2.pem
          cat > ~/.ssh/config <<EOF
          Host ec2
            HostName ${EC2_HOST}
            User ${EC2_USER}
            IdentityFile ~/.ssh/ec2.pem
            StrictHostKeyChecking accept-new
            ServerAliveInterval 30
            ConnectTimeout 30
          EOF
          chmod 600 ~/.ssh/config
          ssh ec2 'echo "Conexion SSH con la EC2 OK"'

      - name: Restaurar wallet de Oracle desde secreto
        env:
          WALLET_B64: ${{ secrets.DB_WALLET_ZIP_B64 }}
        run: |
          echo "$WALLET_B64" | base64 -d > wallet.zip
          mkdir wallet
          unzip -q wallet.zip -d wallet
          rm wallet.zip

      - name: Preparar manifiestos con la imagen del commit
        run: |
          sed "s|__APP_IMAGE__|${APP_IMAGE}|" k8s/deployment.yaml > k8s/deployment.rendered.yaml
          ssh ec2 'rm -rf ~/bdget && mkdir -p ~/bdget/k8s ~/bdget/wallet'
          scp k8s/namespace.yaml k8s/service.yaml k8s/deployment.rendered.yaml ec2:~/bdget/k8s/
          scp -r wallet/. ec2:~/bdget/wallet/

      - name: Crear namespace y secretos en Kubernetes
        run: |
          K='sudo k3s kubectl'
          ssh ec2 "$K apply -f ~/bdget/k8s/namespace.yaml"
          ssh ec2 "$K create secret generic oracle-wallet -n bdget --from-file=\$HOME/bdget/wallet --dry-run=client -o yaml | $K apply -f -"
          ssh ec2 'umask 077 && cat > ~/bdget/db.env' <<EOF
          DB_TNS_ALIAS=${DB_TNS_ALIAS}
          DB_USERNAME=${DB_USERNAME}
          DB_PASSWORD=${DB_PASSWORD}
          EOF
          ssh ec2 "$K create secret generic db-credentials -n bdget --from-env-file=\$HOME/bdget/db.env --dry-run=client -o yaml | $K apply -f -"
          ssh ec2 'rm -rf ~/bdget/wallet ~/bdget/db.env'

      - name: Aplicar manifiestos y esperar el rollout
        run: |
          K='sudo k3s kubectl'
          ssh ec2 "$K apply -f ~/bdget/k8s/service.yaml -f ~/bdget/k8s/deployment.rendered.yaml"
          if ! ssh ec2 "$K rollout status deployment/bdget -n bdget --timeout=300s"; then
            echo "El rollout fallo. Estado y logs:"
            ssh ec2 "$K get pods -n bdget; $K describe pods -n bdget | tail -40; $K logs deployment/bdget -n bdget --tail=100" || true
            ssh ec2 "$K rollout undo deployment/bdget -n bdget" || true
            exit 1
          fi

      # Prueba de humo ejecutada dentro de la EC2 (loopback): evita enviar
      # trafico HTTP en claro por internet y no dispara la regla S5332 de Sonar.
      - name: Prueba de humo (/api/health)
        run: ssh ec2 'curl -fsS --retry 5 --retry-delay 5 --retry-connrefused http://localhost:8081/api/health'

      # Publica la pagina estatica (web/index.html) en Apache (puerto 80).
      # Requiere httpd instalado y activo en la EC2 (ver README).
      - name: Publicar pagina web
        run: |
          scp web/index.html ec2:/tmp/index.html
          ssh ec2 'sudo install -m 644 /tmp/index.html /var/www/html/index.html && rm -f /tmp/index.html'

      # Metricas del pipeline + dashboard + disponibilidad en CloudWatch (IE3).
      # Se ejecuta en la EC2 con su rol de instancia: sin credenciales en GitHub.
      - name: Publicar metricas y dashboard en CloudWatch
        continue-on-error: true
        run: |
          DURATION=$(( $(date +%s) - DEPLOY_START ))
          echo "DEPLOY_SECONDS=${DURATION}" >> "$GITHUB_ENV"
          scp scripts/publish-observability.sh scripts/health-metric.sh monitoring/dashboard.json ec2:/tmp/
          ssh ec2 "bash /tmp/publish-observability.sh ${DURATION} ${COVERAGE}; rm -f /tmp/publish-observability.sh"

      - name: Resumen del despliegue
        run: |
          echo "### Despliegue exitoso en AWS EC2" >> "$GITHUB_STEP_SUMMARY"
          echo "- Commit: \`${GITHUB_SHA}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Imagen: \`${APP_IMAGE}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Orquestador: Kubernetes (k3s), namespace bdget" >> "$GITHUB_STEP_SUMMARY"
          echo "- Health: puerto 8081, ruta /api/health" >> "$GITHUB_STEP_SUMMARY"
          echo "- Pagina web: puerto 80" >> "$GITHUB_STEP_SUMMARY"
          echo "- Tiempo de despliegue: ${DEPLOY_SECONDS:-n/d} s | Cobertura: ${COVERAGE}%" >> "$GITHUB_STEP_SUMMARY"
          echo "- Dashboard: CloudWatch > Bdget-Observabilidad" >> "$GITHUB_STEP_SUMMARY"